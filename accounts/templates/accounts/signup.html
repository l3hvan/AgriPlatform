{% extends 'base.html' %}
{% block content %}
<p class="page-title">Sign up</p>
<div class="card" style="max-width:360px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <label style="font-size:12px;color:#6b6b66;display:block;margin:14px 0 4px;">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<p style="color:#854f0b;font-size:12px;margin:4px 0 0;">{{ field.errors.0 }}</p>{% endif %}
        {% endfor %}
        <button type="submit" class="upload-btn" style="width:100%;margin-top:18px;">Sign up</button>
    </form>
    <p style="font-size:13px;margin-top:14px;">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
