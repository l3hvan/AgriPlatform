{% extends 'base.html' %}
{% block content %}
<p class="page-title">Log in</p>
<div class="card" style="max-width:360px;">
    <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <p style="color:#854f0b;font-size:13px;margin:0 0 12px;">{{ form.non_field_errors.0 }}</p>
        {% endif %}
        <label style="font-size:12px;color:#6b6b66;display:block;margin-bottom:4px;">Username</label>
        {{ form.username }}
        <label style="font-size:12px;color:#6b6b66;display:block;margin:14px 0 4px;">Password</label>
        {{ form.password }}
        <button type="submit" class="upload-btn" style="width:100%;margin-top:18px;">Log in</button>
    </form>
    <p style="font-size:13px;margin-top:14px;">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
