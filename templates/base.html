   {% load static %}
   <!DOCTYPE html>
   <html lang="en">
   <head>
       <meta charset="UTF-8">
       <title>AgriPlatform</title>
       <style>
           * { box-sizing: border-box; }
           body { font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; margin: 0; }
           .container { max-width: 700px; margin: 0 auto; padding: 28px 20px 60px; }
           .nav { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid #e0ddd3; padding-bottom: 12px; }
           .nav a { padding: 6px 14px; border-radius: 6px; font-size: 13px; color: #6b6b66; text-decoration: none; }
           .nav a.active { background: #e6f1fb; color: #0c447c; font-weight: bold; }
           .nav a:hover:not(.active) { background: #f5f4f0; }
           .page-title { font-size: 18px; font-weight: bold; margin: 0 0 4px; }
           .page-sub { font-size: 13px; color: #6b6b66; margin: 0 0 20px; }
           .note { font-size: 12px; color: #a39a55; margin-top: 8px; }
           .grid { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
           .metric { background: #f5f4f0; border-radius: 8px; padding: 14px 16px; flex: 1 1 140px; }
           .metric .label { font-size: 12px; color: #6b6b66; margin: 0 0 6px; }
           .metric .value { font-size: 20px; font-weight: bold; margin: 0; }
           .card { background: #ffffff; border: 1px solid #e0ddd3; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
           .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
           .card-head .h { font-size: 14px; font-weight: bold; margin: 0; }
           .badge { font-size: 11px; background: #e1f5ee; color: #085041; padding: 3px 10px; border-radius: 6px; font-weight: bold; }
           .banner { display: flex; align-items: center; background: #faeeda; border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; font-size: 13px; color: #633806; }
           .banner .dot { width: 8px; height: 8px; border-radius: 50%; background: #854f0b; margin-right: 10px; flex: none; }
           table.kv { width: 100%; font-size: 13px; border-collapse: collapse; }
           table.kv td { padding: 5px 0; }
           table.kv td.k { color: #6b6b66; }
           table.kv td.v { text-align: right; }
       </style>
   </head>
   <body>
       <div class="container">
           <div class="nav">
               <a href="{% url 'home-index' %}" class="{% if active == 'home' %}active{% endif %}">Home</a>
               <a href="{% url 'season-location-index' %}" class="{% if active == 'season-location' %}active{% endif %}">Season &amp; Location</a>
               <a href="{% url 'grains-plants-index' %}" class="{% if active == 'grains-plants' %}active{% endif %}">Grains &amp; Plants</a>
               <a href="{% url 'schedule-index' %}" class="{% if active == 'schedule' %}active{% endif %}">Schedule</a>
           </div>
           {% block content %}{% endblock %}
       </div>
   </body>
   </html>
